<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Finder — Cadastrar Desaparecido</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="WEBFINDER.jpg">
</head>

<body>
<header>
    <div class="container">
        <a href="index.html" class="brand">
            <img src="WEBFINDER.jpg" alt="Logo Web Finder">Web Finder
        </a>
        
        <div class="header-right">
            <div class="zoom-box" title="Ajustar tamanho do site">
                <i class="fas fa-search-plus" aria-hidden="true"></i>
                <label for="zoom-select" class="sr-only">Zoom:</label>
                <select id="zoom-select" aria-label="Ajustar escala da tela">
                    <option value="70%">70%</option>
                    <option value="80%" selected>80%</option>
                    <option value="90%">90%</option>
                    <option value="100%">100%</option>
                    <option value="110%">110%</option>
                    <option value="120%">120%</option>
                </select>
            </div>

            <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <nav id="nav-menu">
            <ul>
                <li><a href="index.html"><i class="fas fa-home"></i> Início</a></li>
                <li><a href="cadastro.html" class="active" aria-current="page"><i class="fas fa-user-plus"></i> Cadastrar Desaparecido</a></li>
                <li><a href="lista.html"><i class="fas fa-list"></i> Lista de Desaparecidos</a></li>
                <li><a href="contato.html"><i class="fas fa-phone"></i> Contato</a></li>
                <li><a href="sobre.html"><i class="fa-regular fa-circle-question"></i> Sobre nós</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <section id="cadastrar" class="cadastro">
        <h2>Cadastrar Desaparecido</h2>
        <form id="desaparecido-form">
            <input type="text" id="nome" placeholder="Nome Completo" required />
            <input type="number" id="idade" placeholder="Idade" required />
            
            <label for="local">Estado do Desaparecimento:</label>
            <select id="local" name="local" required>
                <option value="">Selecione o Estado</option>
                <option value="Acre">Acre</option>
                <option value="Alagoas">Alagoas</option>
                <option value="Amapá">Amapá</option>
                <option value="Amazonas">Amazonas</option>
                <option value="Bahia">Bahia</option>
                <option value="Ceará">Ceará</option>
                <option value="Distrito Federal">Distrito Federal</option>
                <option value="Espírito Santo">Espírito Santo</option>
                <option value="Goiás">Goiás</option>
                <option value="Maranhão">Maranhão</option>
                <option value="Mato Grosso">Mato Grosso</option>
                <option value="Mato Grosso do Sul">Mato Grosso do Sul</option>
                <option value="Minas Gerais">Minas Gerais</option>
                <option value="Pará">Pará</option>
                <option value="Paraíba">Paraíba</option>
                <option value="Paraná">Paraná</option>
                <option value="Pernambuco">Pernambuco</option>
                <option value="Piauí">Piauí</option>
                <option value="Rio de Janeiro">Rio de Janeiro</option>
                <option value="Rio Grande do Norte">Rio Grande do Norte</option>
                <option value="Rio Grande do Sul">Rio Grande do Sul</option>
                <option value="Rondônia">Rondônia</option>
                <option value="Roraima">Roraima</option>
                <option value="Santa Catarina">Santa Catarina</option>
                <option value="São Paulo">São Paulo</option>
                <option value="Sergipe">Sergipe</option>
                <option value="Tocantins">Tocantins</option>
            </select>
            
            <label for="data">Data do Desaparecimento:</label>
            <input type="date" id="data" required />
            
            <label for="imagem">Foto da pessoa:</label>
            <input type="file" id="imagem" accept="image/*" />
            <img id="preview" src="" alt="Pré-visualização da foto" style="display:none;" />

            <input type="text" id="ultimo-contato" placeholder="Último Contato / Local visto" />
            <input type="text" id="parentesco" placeholder="Seu Parentesco com a pessoa" />
            <textarea id="caracteristicas-fisicas" placeholder="Características Físicas (tatuagens, altura, cicatrizes...)"></textarea>
            <textarea id="roupas" placeholder="Roupas que Usava quando desapareceu"></textarea>
            <input type="tel" id="telefone-contato" placeholder="Telefone de Contato (DDD + Número)" oninput="mascaraTelefone(this)" maxlength="15" required />
            <textarea id="descricao" placeholder="Descrição detalhada do caso..."></textarea>
            <button type="submit">Cadastrar</button>
        </form>

        <div id="success-message" class="success-message" style="display: none;">
            <h3>Cadastro concluído com sucesso!</h3>
            <button id="verListaBtn">Ver Lista de Desaparecidos</button>
        </div>

        <div id="loading-overlay" class="loading-overlay" style="display: none;">
            <div class="loading-box">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Carregando cadastro, aguarde...</p>
            </div>
        </div>
    </section>
</main>

<footer>
    <p>© 2026 Web Finder. Todos os direitos reservados.</p>
    <p>Desenvolvido por Web Finder | <a href="https://www.instagram.com/web.finder___2025?utm_source=qr&igsh=cWY5eGM1aW0zeXFv" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i> Instagram</a></p>
</footer>

<script type="module" src="script.js"></script>
<script>
    function mascaraTelefone(input) {
        let valor = input.value.replace(/\D/g, '');
        if (valor.length > 2) valor = `(${valor.substring(0, 2)}) ${valor.substring(2)}`;
        if (valor.length > 10) valor = `${valor.substring(0, 10)}-${valor.substring(10, 14)}`;
        input.value = valor;
    }

    const inputImagem = document.getElementById('imagem');
    const preview = document.getElementById('preview');

    inputImagem.addEventListener('change', () => {
        if (inputImagem.files && inputImagem.files[0]) {
            preview.src = URL.createObjectURL(inputImagem.files[0]);
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }
    });
</script>

<div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script src="site.js"></script>
</body>
</html>
